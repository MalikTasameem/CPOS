<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">البنية المقترحة لشبكة مراقبة CPOS</title>
  <desc id="desc">ثلاثة مداخل: أحداث الأعمال، المسودات غير المتصلة، وأحداث الأمن والإدارة. عقد موحد وهوية ثابتة، ثم مسارات كتابة مناسبة، ثم تخزين ومنع تكرار وعرض موحد مع توافق السجل القديم.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; text-anchor: middle; direction: rtl; unicode-bidi: plaintext; }
      .title { font-size: 29px; font-weight: 700; fill: #0f172a; }
      .head { font-size: 22px; font-weight: 600; fill: #0f172a; }
      .body { font-size: 18px; fill: #334155; }
      .small { font-size: 17px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect width="1200" height="1120" fill="#f8fafc"/>
  <text x="600" y="48" class="title">شبكة مراقبة موحدة — دون تغيير منطق المبيعات والمخزون</text>
  <text x="600" y="81" class="body">مقترح تطوير تدريجي، وليس بنية مطبقة حاليًا</text>

  <rect x="30" y="115" width="360" height="124" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="210" y="154" class="head">أحداث الأمن والإدارة</text>
  <text x="210" y="185" class="body">دخول، صلاحيات، نسخ واستعادة</text>
  <text x="210" y="214" class="small">لا كلمات مرور أو أسرار</text>
  <rect x="420" y="115" width="360" height="124" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="154" class="head">المسودات والعمل غير المتصل</text>
  <text x="600" y="185" class="body">حالة محلية + حدث ثابت الهوية</text>
  <text x="600" y="214" class="small">مستخدم ووقت الحدث الأصليان</text>
  <rect x="810" y="115" width="360" height="124" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="990" y="154" class="head">عمليات الأعمال</text>
  <text x="990" y="185" class="body">بيع، شراء، مخزون، إيصالات، بطاقات</text>
  <text x="990" y="214" class="small">كل المداخل، ومالك واحد لكل فعل</text>

  <path class="line" d="M210 239 V275 H600 V305"/>
  <path class="line" d="M600 239 V305"/>
  <path class="line" d="M990 239 V275 H600 V305"/>
  <rect x="175" y="310" width="850" height="115" class="box" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="600" y="347" class="head">عقد الحدث الموحد</text>
  <text x="600" y="379" class="body">هوية الحدث · المستند والسطر · الفعل والنتيجة · قبل / بعد · السبب</text>
  <text x="600" y="407" class="small">المصدر والجلسة والشاشة الفعلية — مستقلة عن نوع الحركة التجارية</text>

  <path class="line" d="M400 425 V457 H210 V485"/>
  <path class="line" d="M600 425 V485"/>
  <path class="line" d="M800 425 V457 H990 V485"/>
  <rect x="30" y="490" width="360" height="144" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="210" y="527" class="head">قناة مستقلة مناسبة</text>
  <text x="210" y="559" class="body">المحاولة والرفض لا يختفيان</text>
  <text x="210" y="587" class="small">أثر الاستعادة خارج القاعدة المستعادة</text>
  <text x="210" y="613" class="small">التشخيص غير الحساس لا يعطل البيع</text>
  <rect x="420" y="490" width="360" height="144" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="527" class="head">طابور محلي متين</text>
  <text x="600" y="559" class="body">إرسال وإعادة محاولة بنفس الهوية</text>
  <text x="600" y="587" class="small">لا إسقاط قبل تأكيد الاستلام</text>
  <text x="600" y="613" class="small">وقت الوقوع منفصل عن وقت المزامنة</text>
  <rect x="810" y="490" width="360" height="144" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="990" y="527" class="head">حفظ العمل والحدث معًا</text>
  <text x="990" y="559" class="body">نفس الاتصال ومعاملة الحفظ</text>
  <text x="990" y="587" class="small">نجاح أو تراجع لوحدة العمل الحساسة</text>
  <text x="990" y="613" class="small">المراحل المنفصلة تربط بدورة واحدة</text>

  <path class="line" d="M210 634 V670 H600 V695"/>
  <path class="line" d="M600 634 V695"/>
  <path class="line" d="M990 634 V670 H600 V695"/>
  <rect x="230" y="700" width="740" height="104" class="box" fill="#0f172a" stroke="#0f172a"/>
  <text x="600" y="740" style="font-size:23px;font-weight:600;fill:white">سجل منظم + تفاصيل التغيير + علاقات الأحداث</text>
  <text x="600" y="777" style="font-size:18px;fill:#cbd5e1">منع تكرار · توافق مزامنة · صلاحيات · احتفاظ وأرشفة</text>

  <path class="line" d="M600 804 V855"/>
  <rect x="845" y="853" width="325" height="108" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1007" y="891" class="head">التاريخ القديم وسجل المسودات</text>
  <text x="1007" y="922" class="small">طبقة توافق دون نسخ مكرر</text>
  <text x="1007" y="948" class="small">لا اختراع قيم سابقة مفقودة</text>
  <path class="line" d="M845 908 H792"/>
  <rect x="110" y="860" width="675" height="115" class="box" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="447" y="900" class="head">شاشة مراقبة موحدة</text>
  <text x="447" y="932" class="body">بحث آمن · تفاصيل قبل / بعد · مستند وجلسة · صفحات وتصدير</text>
  <text x="447" y="959" class="small">لا إخفاء للأحداث القديمة بسبب تصنيف غير معرّف</text>

  <text x="600" y="1026" class="head">معيار الاكتمال: كل فعل له مالك ومرجع واختبار نجاح وفشل</text>
  <text x="600" y="1061" class="body">عدد الاستدعاءات وحده لا يثبت التغطية — لا تعديل تشغيلي قبل الاعتماد</text>
  <text x="600" y="1095" class="small">CPOS — مراجعة المصدر 2026-10-13</text>
</svg>
